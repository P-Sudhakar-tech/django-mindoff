[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-mindoff"
version = "0.1.0"
description = "Architectural framework for reliable, scalable Django REST APIs with native Polars."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }

authors = [
  { name = "MindOff" }
]

keywords = [
  "django",
  "django-rest-framework",
  "drf",
  "api",
  "api-development",
  "code-generation",
  "scaffolding",
  "automation",
  "boilerplate",
  "cli"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]


dependencies = [
  "django>=5.0",
  "djangorestframework>=3.15.0",
  "polars>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/mindoffwork/django-mindoff"
"Documentation" = "https://github.com/mindoffwork/django-mindoff#readme"
"Repository" = "https://github.com/mindoffwork/django-mindoff.git"
"Issues" = "https://github.com/mindoffwork/django-mindoff/issues"
"Changelog" = "https://github.com/mindoffwork/django-mindoff/blob/main/CHANGELOG.md"

[project.scripts]
django-mindoff = "django_mindoff.cli:main"

[tool.setuptools.packages.find]
include = ["django_mindoff", "django_mindoff.*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
django_mindoff = ["py.typed"]